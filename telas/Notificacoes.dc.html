<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Notificações</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
a{color:#9DD8FF}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="min-height: 1400px; background: #0E1A33; font-family: Figtree, Arial, sans-serif; color: #EEF3FA; padding: 32px 32px 56px; box-sizing: border-box">
  <div style="max-width: 1380px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px">
    <a href="Main.dc.html" style="align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; font-size: 15px; font-weight: 600; text-decoration: none">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
      Minha carteira
    </a>
    <header style="display: flex; flex-direction: column; gap: 4px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px">Notificações</h1>
      <p style="margin: 0; font-size: 15px; color: #A3B4D1">O sino no topo de todas as telas abre esta lista. Cada aviso leva direto para onde está o assunto.</p>
    </header>
    <div style="display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start">
      <section style="flex: 999 1 640px; min-width: 0; background: #15264A; border: 1px solid #243A66; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px">
          <div role="group" aria-label="Filtro" style="display: flex; gap: 6px"><sc-for list="{{abas}}" as="a" hint-placeholder-count="2"><button type="button" onClick="{{a.pick}}" aria-pressed="{{a.sel}}" style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: {{a.borda}}; background: {{a.fundo}}; color: #EEF3FA; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{a.nome}}</button></sc-for></div>
          <button type="button" onClick="{{lerTudo}}" style="display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 0 16px; border: 1px solid #2C4677; border-radius: 10px; background: #1B2E58; color: #EEF3FA; font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; min-height: 40px">Marcar todas como lidas</button>
        </div>
        <sc-for list="{{grupos}}" as="g" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 0">
            <span style="font-size: 13px; font-weight: 700; color: #A3B4D1; padding: 8px 0">{{g.nome}}</span>
            <sc-for list="{{g.itens}}" as="n" hint-placeholder-count="3">
              <a href="{{n.link}}" style="display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 12px; border-radius: 10px; background: {{n.fundo}}; text-decoration: none; color: #EEF3FA">
                <span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; background: {{n.ponto}}"></span>
                <span style="display: flex; flex-direction: column; gap: 2px"><b style="font-size: 15px; font-weight: {{n.peso}}">{{n.t}}</b><span style="font-size: 14px; color: #C6D3E6">{{n.d}}</span></span>
                <span style="font-size: 13px; color: #A3B4D1; white-space: nowrap">{{n.h}}</span>
              </a>
            </sc-for>
          </div>
        </sc-for>
      </section>
      <aside style="flex: 1 1 340px; min-width: 0; background: #15264A; border: 1px solid #243A66; border-radius: 14px; padding: 22px; display: flex; flex-direction: column; gap: 14px">
        <h2 style="margin: 0; font-size: 17px; font-weight: 700">Como você quer ser avisada</h2>
        <sc-for list="{{prefs}}" as="p" hint-placeholder-count="5">
          <div style="display: grid; grid-template-columns: minmax(0, 1fr) 70px 70px; gap: 8px; align-items: center; border-top: 1px solid #243A66; padding-top: 10px; font-size: 14px">
            <span>{{p.nome}}</span>
            <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #C6D3E6"><input type="checkbox" checked="{{p.portal}}" style="width: 18px; height: 18px; accent-color: #00A8F0">Portal</label>
            <label style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: #C6D3E6"><input type="checkbox" checked="{{p.mail}}" style="width: 18px; height: 18px; accent-color: #00A8F0">E-mail</label>
          </div>
        </sc-for>
        <label style="display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; border-top: 1px solid #243A66; padding-top: 10px"><input type="checkbox" checked style="width: 18px; height: 18px; accent-color: #00A8F0"> Resumo diário por e-mail às 8h</label>
      </aside>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { aba: 'Todas', lidas: false }; }
  renderVals() {
    const C = { ri: '#F0656C', at: '#E9862F', az: '#7F9BF2', ok: '#2EC4AE' };
    const G = [
      ['Hoje', [['ri', 'Pedido de cancelamento: CDT Maringá', 'Rafaela registrou um cancelamento total. R$ 1.340 por mês em jogo.', '10:12', 'Retencao.dc.html', 1],
                ['az', '6 itens esperando sua aprovação', 'O mais antigo é a oferta de retenção da CDT Recife, há 7 dias.', '08:00', 'Aprovacoes.dc.html', 1],
                ['at', 'Reunião sem desfecho: CDT Contagem', 'A reunião de ontem às 14h ainda não foi registrada.', '08:00', 'Registrar.dc.html', 1]]],
      ['Ontem', [['ok', 'Contrato assinado: CDT São José do Rio Preto', 'Commit Gold. Conta como upsell de Camila.', '17:40', 'Upsell.dc.html', 0],
                 ['at', 'Implantação parada há 12 dias', 'CDT Itaquera, telefonia. A Implantação ainda não respondeu.', '09:15', 'Upsell.dc.html', 0]]],
      ['Esta semana', [['az', 'Vídeo entregue pela Atendas Vision', 'Pesquisa de satisfação, pronto para a comunicação de 19/11.', 'seg', 'Vision.dc.html', 0],
                       ['ok', 'Carga de franquias concluída', '406 franquias importadas, 5 linhas com erro para corrigir.', 'seg', 'Importacao.dc.html', 0]]],
    ];
    const so = this.state.aba === 'Não lidas';
    const grupos = G.map(([nome, it]) => ({ nome, itens: it.filter((n) => !so || (n[5] && !this.state.lidas)).map(([k, t, d, h, link, nova]) => {
      const nl = nova && !this.state.lidas; return { t, d, h, link, ponto: nl ? C[k] : 'transparent', fundo: nl ? '#163D66' : 'transparent', peso: nl ? '700' : '500' }; }) })).filter((g) => g.itens.length);
    return {
      abas: ['Todas', 'Não lidas'].map((a) => ({ nome: a, sel: a === this.state.aba ? 'true' : 'false', borda: a === this.state.aba ? '2px solid #00A8F0' : '1px solid #2C4677', fundo: a === this.state.aba ? '#163D66' : '#1B2E58', pick: () => this.setState({ aba: a }) })),
      grupos, lerTudo: () => this.setState({ lidas: true }),
      prefs: [['Pedidos de cancelamento', 'true', 'true'], ['Aprovações pendentes', 'true', 'true'], ['Reuniões sem desfecho', 'true', 'false'], ['Contratos assinados', 'true', 'false'], ['Demandas paradas', 'true', 'false']]
        .map(([nome, portal, mail]) => ({ nome, portal, mail })),
    };
  }
}
</script>
</body>
</html>
